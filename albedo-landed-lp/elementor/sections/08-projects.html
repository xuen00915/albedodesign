<section class="alb-lp alb-section alb-projects" data-alb-section="projects" id="projects">
  <div class="alb-container">
    <h2>Real homes, <span class="alb-hl">real transformations</span></h2>
    <div class="alb-projects__feature">
      <figure class="alb-project alb-project--wide">
        <div class="alb-before-after">
          <div class="alb-placeholder" role="img" aria-label="Before renovation image placeholder"><span>Before</span>[IMAGE · BEFORE · 1000×800 · landed project]</div>
          <div class="alb-placeholder" role="img" aria-label="After renovation image placeholder"><span>After</span>[IMAGE · AFTER · 1000×800 · same view]</div>
        </div>
        <figcaption><strong>[Project name · e.g. Corner terrace, Serangoon Gardens]</strong><span>[Full renovation · Modern warm style · X weeks]</span></figcaption>
      </figure>
      <figure class="alb-project">
        <div class="alb-placeholder alb-project__portrait" role="img" aria-label="Second landed project image placeholder">[IMAGE · 800×1100 · project 2]</div>
        <figcaption><strong>[Project name · landed home]</strong><span>[Scope · Style · Duration]</span></figcaption>
      </figure>
    </div>
    <div class="alb-projects__rooms">
      <div class="alb-placeholder" role="img" aria-label="Kitchen project image placeholder">[IMAGE · 1000×700 · kitchen]</div>
      <div class="alb-placeholder" role="img" aria-label="Master bedroom project image placeholder">[IMAGE · 1000×700 · master bedroom]</div>
      <div class="alb-placeholder" role="img" aria-label="Bathroom project image placeholder">[IMAGE · 1000×700 · bathroom]</div>
    </div>
  </div>
</section>
